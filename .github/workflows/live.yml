name: Subway Forever Live

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg and gdown
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade gdown

      - name: Download Subway video from Google Drive
        run: |
          gdown "https://drive.google.com/uc?id=1FIbWWkq_M6_O5AxgLPVp4yRZm8_eOqBB" -O subway.mp4
          ls -lh subway.mp4
          test -s subway.mp4

      - name: Start YouTube Vertical Live
        env:
          YT_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
        run: |
          ffmpeg \
            -re \
            -stream_loop -1 \
            -i subway.mp4 \
            -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=30" \
            -c:v libx264 \
            -preset veryfast \
            -pix_fmt yuv420p \
            -b:v 3000k \
            -maxrate 3500k \
            -bufsize 6000k \
            -g 60 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YT_STREAM_KEY}"
